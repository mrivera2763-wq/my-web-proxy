
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web Proxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090d16;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 32px;
      background: #111827;
      border: 1px solid #263449;
      border-radius: 16px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #60a5fa;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #090d16;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .login-box button {
      width: 100%;
    }

    #message {
      color: #f87171;
      font-size: 14px;
    }

    #app {
      display: none;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    #url {
      flex: 1;
      min-width: 180px;
    }

    iframe {
      width: 100%;
      height: 70vh;
      border: 1px solid #263449;
      border-radius: 12px;
      background: white;
    }

    #status {
      color: #9ca3af;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

  <section id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1>My Web Proxy</h1>
      <p>Private browsing</p>

      <form id="loginForm">
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Login</button>
      </form>

      <p id="message"></p>
    </div>
  </section>

  <main id="app">
    <header>
      <h1>My Web Proxy</h1>
      <button onclick="logout()">Logout</button>
    </header>

    <div class="toolbar">
      <input id="url" type="text" placeholder="Enter a web address">
      <button onclick="navigate()">Go</button>
      <button onclick="back()">Back</button>
      <button onclick="forward()">Forward</button>
      <button onclick="reload()">Reload</button>
    </div>

    <p id="status">Ready to browse</p>

    <iframe id="view" title="Browser view"></iframe>
  </main>

  <script>
    const loginScreen = document.getElementById("loginScreen");
    const app = document.getElementById("app");
    const message = document.getElementById("message");
    const frame = document.getElementById("view");
    const address = document.getElementById("url");
    const status = document.getElementById("status");

    async function checkSession() {
      try {
        const response = await fetch("/api/me");
        const data = await response.json();

        loginScreen.style.display = data.authenticated ? "none" : "flex";
        app.style.display = data.authenticated ? "block" : "none";
      } catch {
        message.textContent = "Connection error.";
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Checking...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          message.textContent = "Incorrect password.";
          return;
        }

        document.getElementById("password").value = "";
        await checkSession();

      } catch {
        message.textContent = "Connection error.";
      }
    });

    async function logout() {
      await fetch("/api/logout", { method: "POST" });
      frame.src = "about:blank";
      address.value = "";
      await checkSession();
    }

    function navigate() {
      let value = address.value.trim();
      if (!value) return;

      if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
      }

      try {
        const parsed = new URL(value);

        if (!["http:", "https:"].includes(parsed.protocol)) {
          throw new Error("Invalid protocol");
        }

        frame.src = parsed.href;
        address.value = parsed.href;
        status.textContent = "Opening: " + parsed.hostname;

      } catch {
        status.textContent = "Invalid web address.";
      }
    }

    function back() {
      try {
        frame.contentWindow.history.back();
      } catch {
        status.textContent = "Back unavailable.";
      }
    }

    function forward() {
      try {
        frame.contentWindow.history.forward();
      } catch {
        status.textContent = "Forward unavailable.";
      }
    }

    function reload() {
      try {
        frame.contentWindow.location.reload();
      } catch {
        status.textContent = "Reload unavailable.";
      }
    }

    address.addEventListener("keydown", event => {
      if (event.key === "Enter") navigate();
    });

    checkSession();
  </script>

</body>
</html>
